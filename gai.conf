# Any label line replaces the whole default label table, so the remaining
# defaults are restated.
label ::1/128       0
label ::/0          1
label 2002::/16     2
label ::/96         3
label ::ffff:0:0/96 4
label fec0::/10     5
label 2001:0::/32   7
# Docker gives containers a ULA (fc00::/7) v6 address, NATed out through the
# host's global one. glibc's default label (6) then ranks v4 above v6 for
# every global destination, so this labels ULA like global v6 to make v6
# preferred.
label fc00::/7      1
