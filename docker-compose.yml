volumes:
  bot-api-data:
  storage:

services:
  # See https://core.telegram.org/bots/api#using-a-local-bot-api-server
  # Using a local bot API server changes the video size limit from 50MB to 2GB!
  bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api-server
    env_file:
      - .env.telegram
    environment:
      - TELEGRAM_LOCAL=1
      - TELEGRAM_STAT=1
    ports:
      # - xxxx:8081 # api port, don't need to expose since we connect locally
      - 1337:8082 # http statistics endpoint
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      - storage:/storage
    restart: always

  # Each of the services below runs a different bot, you may not want
  # to run all of them at the same time.

  # Run the dev bot with hot reloading of local files
  dev:
    container_name: mp4ify_dev
    image: mp4ify_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      # dev and prod share the /storage volume but must NOT share state:
      # telegram file_ids are per-bot (one bot's cached id is a 400 for the
      # other), and a shared jobs table would let each bot run the other's jobs
      - DB_PATH=/storage/mp4ify-dev.db
      - BLOB_DIR=/storage/blobs-dev
      - STAGING_DIR=/storage/staging-dev
    stdin_open: true
    tty: true
    # tini as PID 1: during `bun install` (before the exec hands PID 1 to bun)
    # sh would otherwise ignore SIGTERM as PID 1 and a stop would burn the
    # full 5m grace
    init: true
    volumes:
      - .:/app
      - storage:/storage:rw
    tmpfs:
      - /tmp
    devices:
      - /dev/dri:/dev/dri
    user: '${UID:-1000}:${GID:-1000}'
    restart: unless-stopped
    stop_grace_period: 5m
    depends_on:
      - bot-api

  # Run the prod bot using a pre-built image (TODO)
  prod:
    container_name: mp4ify
    image: mp4ify
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env.prod
    environment:
      # explicit fresh paths (not the code defaults): the volume's old
      # /storage/mp4ify.db was written by the DEV bot before the per-bot
      # split, and its cached telegram file_ids are dev-scoped: adopting it
      # would 400 every cached send. See the dev service's env for why the
      # bots must not share state.
      - DB_PATH=/storage/mp4ify-prod.db
      - BLOB_DIR=/storage/blobs-prod
      - STAGING_DIR=/storage/staging-prod
    volumes:
      - ./.prod-video-cache:/app/.video-cache
      - storage:/storage:rw
    tmpfs:
      - /tmp
    devices:
      - /dev/dri:/dev/dri
    user: '${UID:-1000}:${GID:-1000}'
    restart: always
    # On SIGTERM the bot kills its own downloads (they re-run next boot, no
    # duplicate) and stays alive only to drain in-flight SENDS: the bot-api
    # server completes a started send even if the bot dies (verified live), so
    # dying mid-send re-sends on the next boot. The grace must outlast a
    # worst-case push of a 2GB file to Telegram, not any download.
    stop_grace_period: 5m
    depends_on:
      - bot-api

  test:
    container_name: mp4ify_test
    image: mp4ify_test
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.dev
    environment:
      # arms the test/bin stubs (they delegate to the real binaries without
      # it), so a bun test run inside the DEV container can't stub the live
      # dev bot's own yt-dlp/ffprobe spawns via the shared /tmp/stub toggle
      - STUB_BIN=1
    stdin_open: true
    tty: true
    # deliberately NO storage volume: /storage stays image-local (created in
    # Dockerfile.dev), so test runs on the bare default paths can never touch
    # the dev/prod bots' shared volume, and their boot sweeps can never
    # touch a live test run
    volumes:
      - .:/app
    tmpfs:
      - /tmp
    devices:
      - /dev/dri:/dev/dri
    user: '${UID:-1000}:${GID:-1000}'
    command: bun test --watch
    depends_on:
      - bot-api
